name: Production smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Verify koaslounge.com production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve production domain
        run: |
          python - <<'PY'
          import socket
          host = "koaslounge.com"
          infos = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
          addresses = sorted({item[4][0] for item in infos})
          if not addresses:
              raise SystemExit(f"No DNS addresses resolved for {host}")
          print(f"{host} resolves to:")
          for address in addresses:
              print(f"  {address}")
          PY

      - name: Wait for production and verify admin page
        run: |
          set -euo pipefail
          url="https://koaslounge.com/admin/"
          ok=0
          for attempt in $(seq 1 20); do
            echo "Attempt $attempt: $url"
            if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/admin.html; then
              if grep -Fq "Admin Dashboard" /tmp/admin.html; then
                ok=1
                break
              fi
              echo "Admin page responded but expected admin dashboard was not present."
            fi
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "Production admin page did not become healthy in time."
            exit 1
          fi
          echo "Production admin page is live."

      - name: Verify latest admin frontend bundle
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            echo "Attempt $attempt: latest admin frontend"
            if curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/" -o /tmp/admin-latest.html &&
               grep -Fq '/admin/app.js?v=20261008-4' /tmp/admin-latest.html &&
               curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-app.js &&
               grep -Fq 'const BUILD="20261008-4"' /tmp/admin-app.js; then
              ok=1
              break
            fi
            echo "Latest frontend has not propagated yet."
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "Latest admin frontend did not become live in time."
            exit 1
          fi
          echo "Latest admin frontend bundle is live."

      - name: Verify unpaid completed-week summary
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/" -o /tmp/admin-unpaid-summary.html
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-unpaid-summary.js
          grep -Fq 'Unpaid completed-week hours' /tmp/admin-unpaid-summary.html
          grep -Fq 'unpaidWeekEntries=weekEntries.filter' /tmp/admin-unpaid-summary.js
          grep -Fq 'unpaidWeekHours' /tmp/admin-unpaid-summary.js
          grep -Fq 'unpaid gross' /tmp/admin-unpaid-summary.js
          grep -Fq 'Paid' /tmp/admin-unpaid-summary.js
          echo "Completed-week summary is scoped to unpaid shifts."
      - name: Verify outstanding payroll dashboard
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/" -o /tmp/admin-outstanding.html
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-outstanding.js
          grep -Fq 'id="overviewOutstandingTotal"' /tmp/admin-outstanding.html
          grep -Fq 'id="overviewOutstandingEmployees"' /tmp/admin-outstanding.html
          grep -Fq 'Total unpaid payroll' /tmp/admin-outstanding.html
          grep -Fq 'runShortfall' /tmp/admin-outstanding.js
          grep -Fq 'ratePendingHours' /tmp/admin-outstanding.js
          grep -Fq 't.business_date<=w.end' /tmp/admin-outstanding.js
          echo "Outstanding payroll dashboard is live."

      - name: Verify Toast duplicate protection
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-dedupe.js
          grep -Fq 'Already imported — duplicate shift.' /tmp/admin-dedupe.js
          grep -Fq 'Duplicates' /tmp/admin-dedupe.js
          grep -Fq 'duplicates_skipped' /tmp/admin-dedupe.js
          echo "Toast duplicate protection UI is live."

      - name: Verify employee-scoped payment confirmation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-pay-confirm.js
          grep -Fq 'payConfirmation?.employee_id===e.id' /tmp/admin-pay-confirm.js
          grep -Fq 'paid to "+paidEmployee.name+" via ' /tmp/admin-pay-confirm.js
          echo "Payment confirmation is scoped to the selected employee."

      - name: Verify QuickBooks integration shell
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/" -o /tmp/admin-qb.html
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-qb.js
          grep -Fq 'id="quickbooksConnectBtn"' /tmp/admin-qb.html
          grep -Fq 'id="quickbooksPayrollBtn"' /tmp/admin-qb.html
          grep -Fq 'quickbooks-status' /tmp/admin-qb.js
          grep -Fq 'quickbooks-sync-time' /tmp/admin-qb.js
          echo "QuickBooks integration shell is live."

      - name: Verify automatic employee creation UI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/" -o /tmp/admin-employees.html
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-employees.js
          grep -Fq 'id="addEmployeeBtn"' /tmp/admin-employees.html
          grep -Fq 'id="overviewAddEmployeeBtn"' /tmp/admin-employees.html
          grep -Fq 'id="addEmployeeDialog"' /tmp/admin-employees.html
          grep -Fq 'employee-create' /tmp/admin-employees.js
          grep -Fq 'will be added automatically' /tmp/admin-employees.js
          grep -Fq 'rate later' /tmp/admin-employees.js
          echo "Manual and automatic employee creation UI is live."

      - name: Verify admin overview landing
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/" -o /tmp/admin-overview.html
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-overview.js
          grep -Fq 'id="overviewView"' /tmp/admin-overview.html
          grep -Fq 'Admin Dashboard' /tmp/admin-overview.html
          grep -Fq 'data-view="employees"' /tmp/admin-overview.html
          grep -Fq 'data-view="payroll"' /tmp/admin-overview.html
          grep -Fq 'function renderOverview' /tmp/admin-overview.js
          grep -Fq 'currentView="overview"' /tmp/admin-overview.js
          echo "Business-level admin overview is live."

      - name: Verify multi-employee Toast import
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/" -o /tmp/admin-multi.html
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-multi.js
          grep -Fq 'id="employee_select"' /tmp/admin-multi.html
          grep -Fq 'id="pay_employee_select"' /tmp/admin-multi.html
          grep -Fq 'New employees detected' /tmp/admin-multi.js
          grep -Fq 'new_employee' /tmp/admin-multi.js
          echo "Multi-employee Toast import UI is live."

      - name: Verify Toast CSV support
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/app.js?v=20261008-4" -o /tmp/admin-toast.js
          grep -Fq 'payablehours' /tmp/admin-toast.js
          grep -Fq 'weekly-derived' /tmp/admin-toast.js
          grep -Fq 'Time Entries CSV supported' <(curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/")
          echo "Native Toast CSV support is live."

      - name: Verify tax deductions default off
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://koaslounge.com/admin/" -o /tmp/admin-tax-default.html
          if grep -Eq 'id="apply_tax_deductions"[^>]*checked' /tmp/admin-tax-default.html; then
            echo "Tax deductions are still checked by default in production."
            exit 1
          fi
          grep -Fq 'id="apply_tax_deductions"' /tmp/admin-tax-default.html
          echo "Tax deductions default is OFF."

      - name: Verify login POST path
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/login-test.json --write-out "%{http_code}" \
            --request POST \
            --header "Origin: https://koaslounge.com" \
            --header "Content-Type: application/json" \
            --data '{"email":"invalid@example.com","password":"definitely-wrong-password"}' \
            "https://koaslounge.com/.netlify/functions/payroll-admin?op=login")
          cat /tmp/login-test.json
          if [ "$code" != "401" ]; then
            echo "Expected 401 invalid credentials from login POST, got HTTP $code"
            exit 1
          fi
          grep -Fq 'Invalid email or password.' /tmp/login-test.json
          echo "Login POST reached credential validation."

      - name: Verify recovery POST path
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/recovery-test.json --write-out "%{http_code}" \
            --request POST \
            --header "Origin: https://koaslounge.com" \
            --header "Content-Type: application/json" \
            --data '{"email":"invalid@example.com","recovery_key":"invalid","new_password":"not-a-real-password"}' \
            "https://koaslounge.com/.netlify/functions/payroll-admin?op=admin-recovery")
          cat /tmp/recovery-test.json
          if [ "$code" != "403" ] && [ "$code" != "410" ]; then
            echo "Expected safe recovery rejection (403 or 410), got HTTP $code"
            exit 1
          fi
          echo "Recovery POST path is live and safely rejects reuse/invalid requests."

      - name: Verify payroll backend status
        run: |
          set -euo pipefail
          url="https://koaslounge.com/.netlify/functions/payroll-admin?op=status"
          ok=0
          for attempt in $(seq 1 12); do
            echo "Attempt $attempt: payroll status endpoint"
            if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/payroll-status.json; then
              if python - <<'PY'
          import json
          with open("/tmp/payroll-status.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if data.get("configured") is not True:
              raise SystemExit(f"Payroll admin should be configured, got: {data.get('configured')!r}")
          if data.get("tax_engine_version") != "2026.1":
              raise SystemExit(f"Unexpected tax engine version: {data.get('tax_engine_version')!r}")
          if data.get("admin_build") != "20261008-2":
              raise SystemExit(f"Unexpected admin backend build: {data.get('admin_build')!r}")
          print("Payroll backend status:", data)
          PY
              then
                ok=1
                break
              fi
            fi
            echo "Status endpoint not healthy yet."
            cat /tmp/payroll-status.json 2>/dev/null || true
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Payroll backend status endpoint did not become healthy in time."
            exit 1
          fi
